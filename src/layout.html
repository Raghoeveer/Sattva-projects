<!doctype html>
<html lang="en-IN">
  <head>
    {{ analytics }}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title_attr }}</title>
    <meta name="description" content="{{ description_attr }}" />
    <meta name="robots" content="{{ robots }}" />
    <meta name="theme-color" content="{{ theme_color }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site_name }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:title" content="{{ title_attr }}" />
    <meta property="og:description" content="{{ description_attr }}" />
    <meta property="og:image" content="{{ base_url }}{{ og_image }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/images/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/site.css" />
    {{ project_schema }}
    {{ head_extra }}
  </head>
  <body>
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include overlays.html %}
    <script src="/js/site.js" defer></script>
    {{ zendesk }}
  </body>
</html>
